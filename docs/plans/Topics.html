document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1f264fd9-7637-4643-a736-5d08f20148e0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"75931cc5-0549-4e0f-af78-337b95d14775\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"849c3ca7-5cfc-4794-ab46-4fc58519f666\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1f264fd9-7637-4643-a736-5d08f20148e0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Space Grotesk 400 */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"945af963-6551-4d30-9072-0168f14a5c4c\") format('woff2');\n}\n/* Space Grotesk 500 */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"945af963-6551-4d30-9072-0168f14a5c4c\") format('woff2');\n}\n/* Space Grotesk 600 */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"945af963-6551-4d30-9072-0168f14a5c4c\") format('woff2');\n}\n/* Space Grotesk 700 */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"945af963-6551-4d30-9072-0168f14a5c4c\") format('woff2');\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n   COLORS — Compendium Design System\n   Light is the default (:root); dark mode is class-scoped (.dark) to match the\n   product's `darkMode: 'class'` strategy. The reference redesign is dark-first,\n   so dark mode is the \"hero\" surface — but both are first-class.\n   ========================================================================== */\n\n:root {\n  /* ---- Base palette (raw values) ---------------------------------------- */\n  /* Slate neutrals — the entire UI is built on Tailwind's slate ramp. */\n  --slate-50:  #F8FAFC;\n  --slate-100: #F1F5F9;\n  --slate-200: #E2E8F0;\n  --slate-300: #CBD5E1;\n  --slate-400: #94A3B8;\n  --slate-500: #64748B;\n  --slate-600: #475569;\n  --slate-700: #334155;\n  --slate-800: #1E293B;\n  --slate-900: #0F172A;\n  --slate-950: #020617;\n\n  /* Brand blues — the single accent hue. Indigo-tinted in dark mode. */\n  --blue-400:  #60A5FA;\n  --blue-500:  #3B82F6;\n  --blue-600:  #2563EB;\n  --blue-700:  #1D4ED8;\n  --indigo-300: #A5B4FC;\n  --indigo-400: #818CF8;\n  --indigo-900: #312E81;\n\n  --white: #FFFFFF;\n  --black: #000000;\n\n  /* ---- Semantic aliases (light mode) ------------------------------------ */\n  --background:        var(--slate-50);   /* page background            */\n  --card-bg:           var(--white);      /* card / nav / popover       */\n  --primary-text:      var(--slate-900);  /* headings + body            */\n  --muted-text:        var(--slate-500);  /* secondary / captions       */\n  --accent:            var(--blue-500);   /* links, active, focus ring  */\n  --accent-foreground: var(--white);      /* text on accent             */\n  --accent-hover:      var(--blue-600);   /* solid-blue button hover    */\n  --border:            var(--slate-200);  /* hairline borders           */\n  --table-header-bg:   var(--slate-100);  /* table head / secondary fill*/\n  --row-hover-bg:      var(--slate-50);   /* table row / list hover     */\n  --nav-border:        var(--slate-200);  /* sticky nav bottom border   */\n  --ring:              var(--blue-500);   /* focus ring color           */\n\n  /* Destructive (clear-filters, delete) */\n  --destructive:            #EF4444;\n  --destructive-foreground: var(--white);\n\n  /* ---- Badge / status pairs (light) ------------------------------------- */\n  --badge-primary-bg:    #EFF6FF;\n  --badge-primary-text:  #3B82F6;\n  --badge-secondary-bg:  #F0FDF4;\n  --badge-secondary-text:#16A34A;\n}\n\n.dark {\n  /* ---- Semantic aliases (dark mode) ------------------------------------- */\n  --background:        var(--slate-900);  /* deep navy                  */\n  --card-bg:           var(--slate-800);  /* charcoal card              */\n  --primary-text:      var(--slate-100);\n  --muted-text:        var(--slate-400);\n  --accent:            var(--indigo-400); /* softer indigo on dark      */\n  --accent-foreground: var(--white);\n  --accent-hover:      var(--blue-700);\n  --border:            var(--slate-700);\n  --table-header-bg:   var(--slate-800);\n  --row-hover-bg:      #263347;           /* slightly lifted row hover  */\n  --nav-border:        var(--slate-700);\n  --ring:              var(--indigo-400);\n\n  --badge-primary-bg:    var(--indigo-900);\n  --badge-primary-text:  var(--indigo-300);\n  --badge-secondary-bg:  #064E3B;\n  --badge-secondary-text:#6EE7B7;\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n   BADGE PALETTES — semantic pricing + categorical tag colors\n   The product assigns each pricing tier a fixed color pair, and each\n   free-form tag a deterministic color from a rotating 6-swatch ramp\n   (hashed by label). Both have light/dark variants. Exposed as tokens so\n   designs can reference them directly.\n   ========================================================================== */\n\n:root {\n  /* ---- Pricing tiers (light) -------------------------------------------- */\n  --price-free-bg:        #ECFDF5;  --price-free-text:        #065F46;  /* emerald  */\n  --price-freemium-bg:    #EFF6FF;  --price-freemium-text:    #1D4ED8;  /* blue     */\n  --price-free-trial-bg:  #F5F3FF;  --price-free-trial-text:  #6D28D9;  /* violet   */\n  --price-subscription-bg:#FFF1F2;  --price-subscription-text:#9F1239;  /* rose     */\n  --price-onetime-bg:     #FFFBEB;  --price-onetime-text:     #92400E;  /* amber    */\n  --price-fund-bg:        #ECFEFF;  --price-fund-text:        #155E75;  /* cyan     */\n\n  /* ---- Categorical tag ramp (light) — hashed rotation ------------------- */\n  --tag-1-bg: #EFF6FF;  --tag-1-text: #1D4ED8;  /* blue   */\n  --tag-2-bg: #F5F3FF;  --tag-2-text: #6D28D9;  /* violet */\n  --tag-3-bg: #ECFDF5;  --tag-3-text: #065F46;  /* emerald*/\n  --tag-4-bg: #FFFBEB;  --tag-4-text: #92400E;  /* amber  */\n  --tag-5-bg: #FFF1F2;  --tag-5-text: #9F1239;  /* rose   */\n  --tag-6-bg: #ECFEFF;  --tag-6-text: #155E75;  /* cyan   */\n}\n\n.dark {\n  /* ---- Pricing tiers (dark) --------------------------------------------- */\n  --price-free-bg:        #064E3B;  --price-free-text:        #6EE7B7;\n  --price-freemium-bg:    #1E3A5F;  --price-freemium-text:    #93C5FD;\n  --price-free-trial-bg:  #2E1B69;  --price-free-trial-text:  #C4B5FD;\n  --price-subscription-bg:#4C0519;  --price-subscription-text:#FDA4AF;\n  --price-onetime-bg:     #451A03;  --price-onetime-text:     #FCD34D;\n  --price-fund-bg:        #164E63;  --price-fund-text:        #67E8F9;\n\n  /* ---- Categorical tag ramp (dark) -------------------------------------- */\n  --tag-1-bg: #1E3A5F;  --tag-1-text: #93C5FD;\n  --tag-2-bg: #2E1B69;  --tag-2-text: #C4B5FD;\n  --tag-3-bg: #064E3B;  --tag-3-text: #6EE7B7;\n  --tag-4-bg: #451A03;  --tag-4-text: #FCD34D;\n  --tag-5-bg: #4C0519;  --tag-5-text: #FDA4AF;\n  --tag-6-bg: #164E63;  --tag-6-text: #67E8F9;\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n   TYPOGRAPHY — Compendium Design System\n   One typeface, full stop: Space Grotesk for everything (UI, headings, body).\n   A monospace stack is reserved for code / wallet addresses / IDs.\n   Weights in use: 400 (body), 500 (medium / nav), 600 (semibold), 700 (bold).\n   ========================================================================== */\n\n:root {\n  /* ---- Families --------------------------------------------------------- */\n  --font-sans: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  /* ---- Weights ---------------------------------------------------------- */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* ---- Type scale (rem @ 16px base) ------------------------------------- */\n  --text-xs:   0.75rem;   /* 12px — date stamps, badges, captions  */\n  --text-sm:   0.875rem;  /* 14px — body, nav, descriptions        */\n  --text-base: 1rem;      /* 16px — default                        */\n  --text-lg:   1.125rem;  /* 18px — card titles, section heads     */\n  --text-xl:   1.25rem;   /* 20px                                  */\n  --text-2xl:  1.5rem;    /* 24px — \"Related tools\" head           */\n  --text-3xl:  1.875rem;  /* 30px — detail-page product name       */\n  --text-4xl:  2.25rem;   /* 36px — landing hero                   */\n\n  /* ---- Line heights ----------------------------------------------------- */\n  --leading-tight:   1.2;    /* large headings (tracking-tight)    */\n  --leading-snug:    1.4;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.625;  /* hero paragraph                     */\n  --leading-loose:   1.75;   /* long-form description body         */\n\n  /* ---- Letter spacing --------------------------------------------------- */\n  --tracking-tight:  -0.025em; /* applied to big bold headings      */\n  --tracking-normal: 0;\n  --tracking-wide:   0.05em;   /* uppercase sidebar labels          */\n\n  /* ---- Semantic roles --------------------------------------------------- */\n  --text-hero:         var(--text-4xl);\n  --text-title:        var(--text-3xl);\n  --text-card-title:   var(--text-lg);\n  --text-body:         var(--text-sm);\n  --text-caption:      var(--text-xs);\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n   SPACING & SIZING — Compendium Design System\n   Tailwind's 4px base unit. Card padding is p-5 (20px); detail cards p-6 (24px);\n   sidebar cards p-4 (16px). Grids gap-5 (20px). Page gutters px-6 (24px).\n   ========================================================================== */\n\n:root {\n  /* ---- Spacing scale (4px base) ----------------------------------------- */\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4px  — icon/label gaps                 */\n  --space-2:  0.5rem;   /* 8px  — tight chip gaps                 */\n  --space-3:  0.75rem;  /* 12px — card inner row gap              */\n  --space-4:  1rem;     /* 16px — sidebar card padding            */\n  --space-5:  1.25rem;  /* 20px — card padding, grid gap          */\n  --space-6:  1.5rem;   /* 24px — page gutter, detail card pad    */\n  --space-8:  2rem;     /* 32px — section spacing                 */\n  --space-10: 2.5rem;   /* 40px — hero vertical rhythm            */\n  --space-12: 3rem;     /* 48px                                   */\n\n  /* ---- Semantic spacing ------------------------------------------------- */\n  --gutter-page:      var(--space-6);   /* px-6 horizontal page padding   */\n  --pad-card:         var(--space-5);   /* directory card                 */\n  --pad-card-detail:  var(--space-6);   /* detail-page left card          */\n  --pad-card-sidebar: var(--space-4);   /* detail-page sidebar cards      */\n  --gap-grid:         var(--space-5);   /* grid gap between cards          */\n  --gap-stack:        var(--space-3);   /* default vertical stack         */\n\n  /* ---- Layout widths ---------------------------------------------------- */\n  --width-content:   80rem;   /* max-w-7xl — directory grid         */\n  --width-detail:    72rem;   /* max-w-6xl — detail page            */\n  --width-prose:     42rem;   /* max-w-2xl — landing hero copy      */\n  --height-nav:      3.5rem;  /* h-14 sticky navbar                 */\n\n  /* ---- Icon / control sizing -------------------------------------------- */\n  --size-icon-sm:  0.875rem; /* 14px brand glyphs                  */\n  --size-icon:     1rem;     /* 16px lucide default                */\n  --size-logo-sm:  2rem;     /* 32px card favicon                  */\n  --size-logo-lg:  4rem;     /* 64px detail hero logo              */\n  --control-h:     2.25rem;  /* 36px — filter buttons (h-9)        */\n  --control-h-lg:  2.75rem;  /* 44px — primary buttons (h-11)      */\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n   RADIUS, SHADOWS & MOTION — Compendium Design System\n   The product is restrained: hairline borders do most of the work, shadows are\n   used sparingly (popovers/dropdowns only), and cards rely on border + a small\n   hover lift rather than heavy elevation. Corner radii follow shadcn's --radius\n   convention (base 0.5rem) plus a larger rounded-xl for cards.\n   ========================================================================== */\n\n:root {\n  /* ---- Corner radii ----------------------------------------------------- */\n  --radius:     0.5rem;                 /* 8px  — shadcn base (--radius)    */\n  --radius-sm:  calc(var(--radius) - 4px); /* 4px — small chips / inputs    */\n  --radius-md:  calc(var(--radius) - 2px); /* 6px — buttons                 */\n  --radius-lg:  var(--radius);          /* 8px  — landing info cards        */\n  --radius-xl:  0.75rem;                /* 12px — directory + detail cards  */\n  --radius-full:9999px;                 /* pills: category, tag, price      */\n\n  /* ---- Elevation -------------------------------------------------------- */\n  /* Cards: NO drop shadow — defined by a 1px border. Overlays get shadows. */\n  --shadow-none:  none;\n  --shadow-sm:    0 1px 2px 0 rgb(15 23 42 / 0.05);\n  --shadow-popover: 0 4px 12px -2px rgb(15 23 42 / 0.10),\n                    0 2px 6px -2px  rgb(15 23 42 / 0.08);  /* dropdowns/popovers */\n\n  /* ---- Focus ring ------------------------------------------------------- */\n  --ring-width:  2px;\n  --ring-offset: 2px;\n\n  /* ---- Motion ----------------------------------------------------------- */\n  /* Quiet, utilitarian. Color/transform transitions only; no bounces. */\n  --duration-fast:  150ms; /* @kind other */\n  --duration-base:  200ms; /* @kind other */\n  --ease-standard:  cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */  /* Tailwind default ease */\n  --transition-colors: color var(--duration-base) var(--ease-standard),\n                       background-color var(--duration-base) var(--ease-standard),\n                       border-color var(--duration-base) var(--ease-standard);\n  --transition-all:    all var(--duration-base) var(--ease-standard);\n\n  /* Signature card-hover lift */\n  --hover-lift: translateY(-2px); /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n   Compendium Design System — global stylesheet entry point\n   Consumers link THIS one file. It is an @import manifest only; every token\n   and @font-face lives in a file reached from here.\n   ============================================================================ */\n\n/* ============================================================================\n   FONTS — Space Grotesk (Google Fonts)\n   The product loads Space Grotesk from Google Fonts at weights 400/500/600/700.\n   We declare @font-face for the woff2 binaries Google serves so consumers ship\n   the real webfont. A CDN @import is also provided as a resilient fallback.\n   ========================================================================== */\n\n/* Resilient fallback: pulls the full family if the @font-face below is blocked. */\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"75931cc5-0549-4e0f-af78-337b95d14775\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"849c3ca7-5cfc-4794-ab46-4fc58519f666\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1f264fd9-7637-4643-a736-5d08f20148e0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"75931cc5-0549-4e0f-af78-337b95d14775\") forma de-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"75931cc5-0549-4e0f-af78-337b95d14775\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"849c3ca7-5cfc-4794-ab46-4fc58519f666\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1f264fd9-7637-4643-a736-5d08f20148e0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Space Grotesk 400 */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"945af963-6551-4d30-9072-0168f14a5c4c\") format('woff2');\n}\n/* Space Grotesk 500 */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"945af963-6551-4d30-9072-0168f14a5c4c\") format('woff2');\n}\n/* Space Grotesk 600 */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"945af963-6551-4d30-9072-0168f14a5c4c\") format('woff2');\n}\n/* Space Grotesk 700 */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"945af963-6551-4d30-9072-0168f14a5c4c\") format('woff2');\n}\n\n/* ============================================================================\n   COLORS — Compendium Design System\n   Light is the default (:root); dark mode is class-scoped (.dark) to match the\n   product's `darkMode: 'class'` strategy. The reference redesign is dark-first,\n   so dark mode is the \"hero\" surface — but both are first-class.\n   ========================================================================== */\n\n:root {\n  /* ---- Base palette (raw values) ---------------------------------------- */\n  /* Slate neutrals — the entire UI is built on Tailwind's slate ramp. */\n  --slate-50:  #F8FAFC;\n  --slate-100: #F1F5F9;\n  --slate-200: #E2E8F0;\n  --slate-300: #CBD5E1;\n  --slate-400: #94A3B8;\n  --slate-500: #64748B;\n  --slate-600: #475569;\n  --slate-700: #334155;\n  --slate-800: #1E293B;\n  --slate-900: #0F172A;\n  --slate-950: #020617;\n\n  /* Brand blues — the single accent hue. Indigo-tinted in dark mode. */\n  --blue-400:  #60A5FA;\n  --blue-500:  #3B82F6;\n  --blue-600:  #2563EB;\n  --blue-700:  #1D4ED8;\n  --indigo-300: #A5B4FC;\n  --indigo-400: #818CF8;\n  --indigo-900: #312E81;\n\n  --white: #FFFFFF;\n  --black: #000000;\n\n  /* ---- Semantic aliases (light mode) ------------------------------------ */\n  --background:        var(--slate-50);   /* page background            */\n  --card-bg:           var(--white);      /* card / nav / popover       */\n  --primary-text:      var(--slate-900);  /* headings + body            */\n  --muted-text:        var(--slate-500);  /* secondary / captions       */\n  --accent:            var(--blue-500);   /* links, active, focus ring  */\n  --accent-foreground: var(--white);      /* text on accent             */\n  --accent-hover:      var(--blue-600);   /* solid-blue button hover    */\n  --border:            var(--slate-200);  /* hairline borders           */\n  --table-header-bg:   var(--slate-100);  /* table head / secondary fill*/\n  --row-hover-bg:      var(--slate-50);   /* table row / list hover     */\n  --nav-border:        var(--slate-200);  /* sticky nav bottom border   */\n  --ring:              var(--blue-500);   /* focus ring color           */\n\n  /* Destructive (clear-filters, delete) */\n  --destructive:            #EF4444;\n  --destructive-foreground: var(--white);\n\n  /* ---- Badge / status pairs (light) ------------------------------------- */\n  --badge-primary-bg:    #EFF6FF;\n  --badge-primary-text:  #3B82F6;\n  --badge-secondary-bg:  #F0FDF4;\n  --badge-secondary-text:#16A34A;\n}\n\n.dark {\n  /* ---- Semantic aliases (dark mode) ------------------------------------- */\n  --background:        var(--slate-900);  /* deep navy                  */\n  --card-bg:           var(--slate-800);  /* charcoal card              */\n  --primary-text:      var(--slate-100);\n  --muted-text:        var(--slate-400);\n  --accent:            var(--indigo-400); /* softer indigo on dark      */\n  --accent-foreground: var(--white);\n  --accent-hover:      var(--blue-700);\n  --border:            var(--slate-700);\n  --table-header-bg:   var(--slate-800);\n  --row-hover-bg:      #263347;           /* slightly lifted row hover  */\n  --nav-border:        var(--slate-700);\n  --ring:              var(--indigo-400);\n\n  --badge-primary-bg:    var(--indigo-900);\n  --badge-primary-text:  var(--indigo-300);\n  --badge-secondary-bg:  #064E3B;\n  --badge-secondary-text:#6EE7B7;\n}\n\n/* ============================================================================\n   BADGE PALETTES — semantic pricing + categorical tag colors\n   The product assigns each pricing tier a fixed color pair, and each\n   free-form tag a deterministic color from a rotating 6-swatch ramp\n   (hashed by label). Both have light/dark variants. Exposed as tokens so\n   designs can reference them directly.\n   ========================================================================== */\n\n:root {\n  /* ---- Pricing tiers (light) -------------------------------------------- */\n  --price-free-bg:        #ECFDF5;  --price-free-text:        #065F46;  /* emerald  */\n  --price-freemium-bg:    #EFF6FF;  --price-freemium-text:    #1D4ED8;  /* blue     */\n  --price-free-trial-bg:  #F5F3FF;  --price-free-trial-text:  #6D28D9;  /* violet   */\n  --price-subscription-bg:#FFF1F2;  --price-subscription-text:#9F1239;  /* rose     */\n  --price-onetime-bg:     #FFFBEB;  --price-onetime-text:     #92400E;  /* amber    */\n  --price-fund-bg:        #ECFEFF;  --price-fund-text:        #155E75;  /* cyan     */\n\n  /* ---- Categorical tag ramp (light) — hashed rotation ------------------- */\n  --tag-1-bg: #EFF6FF;  --tag-1-text: #1D4ED8;  /* blue   */\n  --tag-2-bg: #F5F3FF;  --tag-2-text: #6D28D9;  /* violet */\n  --tag-3-bg: #ECFDF5;  --tag-3-text: #065F46;  /* emerald*/\n  --tag-4-bg: #FFFBEB;  --tag-4-text: #92400E;  /* amber  */\n  --tag-5-bg: #FFF1F2;  --tag-5-text: #9F1239;  /* rose   */\n  --tag-6-bg: #ECFEFF;  --tag-6-text: #155E75;  /* cyan   */\n}\n\n.dark {\n  /* ---- Pricing tiers (dark) --------------------------------------------- */\n  --price-free-bg:        #064E3B;  --price-free-text:        #6EE7B7;\n  --price-freemium-bg:    #1E3A5F;  --price-freemium-text:    #93C5FD;\n  --price-free-trial-bg:  #2E1B69;  --price-free-trial-text:  #C4B5FD;\n  --price-subscription-bg:#4C0519;  --price-subscription-text:#FDA4AF;\n  --price-onetime-bg:     #451A03;  --price-onetime-text:     #FCD34D;\n  --price-fund-bg:        #164E63;  --price-fund-text:        #67E8F9;\n\n  /* ---- Categorical tag ramp (dark) -------------------------------------- */\n  --tag-1-bg: #1E3A5F;  --tag-1-text: #93C5FD;\n  --tag-2-bg: #2E1B69;  --tag-2-text: #C4B5FD;\n  --tag-3-bg: #064E3B;  --tag-3-text: #6EE7B7;\n  --tag-4-bg: #451A03;  --tag-4-text: #FCD34D;\n  --tag-5-bg: #4C0519;  --tag-5-text: #FDA4AF;\n  --tag-6-bg: #164E63;  --tag-6-text: #67E8F9;\n}\n\n/* ============================================================================\n   TYPOGRAPHY — Compendium Design System\n   One typeface, full stop: Space Grotesk for everything (UI, headings, body).\n   A monospace stack is reserved for code / wallet addresses / IDs.\n   Weights in use: 400 (body), 500 (medium / nav), 600 (semibold), 700 (bold).\n   ========================================================================== */\n\n:root {\n  /* ---- Families --------------------------------------------------------- */\n  --font-sans: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  /* ---- Weights ---------------------------------------------------------- */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* ---- Type scale (rem @ 16px base) ------------------------------------- */\n  --text-xs:   0.75rem;   /* 12px — date stamps, badges, captions  */\n  --text-sm:   0.875rem;  /* 14px — body, nav, descriptions        */\n  --text-base: 1rem;      /* 16px — default                        */\n  --text-lg:   1.125rem;  /* 18px — card titles, section heads     */\n  --text-xl:   1.25rem;   /* 20px                                  */\n  --text-2xl:  1.5rem;    /* 24px — \"Related tools\" head           */\n  --text-3xl:  1.875rem;  /* 30px — detail-page product name       */\n  --text-4xl:  2.25rem;   /* 36px — landing hero                   */\n\n  /* ---- Line heights ----------------------------------------------------- */\n  --leading-tight:   1.2;    /* large headings (tracking-tight)    */\n  --leading-snug:    1.4;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.625;  /* hero paragraph                     */\n  --leading-loose:   1.75;   /* long-form description body         */\n\n  /* ---- Letter spacing --------------------------------------------------- */\n  --tracking-tight:  -0.025em; /* applied to big bold headings      */\n  --tracking-normal: 0;\n  --tracking-wide:   0.05em;   /* uppercase sidebar labels          */\n\n  /* ---- Semantic roles --------------------------------------------------- */\n  --text-hero:         var(--text-4xl);\n  --text-title:        var(--text-3xl);\n  --text-card-title:   var(--text-lg);\n  --text-body:         var(--text-sm);\n  --text-caption:      var(--text-xs);\n}\n\n/* ============================================================================\n   SPACING & SIZING — Compendium Design System\n   Tailwind's 4px base unit. Card padding is p-5 (20px); detail cards p-6 (24px);\n   sidebar cards p-4 (16px). Grids gap-5 (20px). Page gutters px-6 (24px).\n   ========================================================================== */\n\n:root {\n  /* ---- Spacing scale (4px base) ----------------------------------------- */\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4px  — icon/label gaps                 */\n  --space-2:  0.5rem;   /* 8px  — tight chip gaps                 */\n  --space-3:  0.75rem;  /* 12px — card inner row gap              */\n  --space-4:  1rem;     /* 16px — sidebar card padding            */\n  --space-5:  1.25rem;  /* 20px — card padding, grid gap          */\n  --space-6:  1.5rem;   /* 24px — page gutter, detail card pad    */\n  --space-8:  2rem;     /* 32px — section spacing                 */\n  --space-10: 2.5rem;   /* 40px — hero vertical rhythm            */\n  --space-12: 3rem;     /* 48px                                   */\n\n  /* ---- Semantic spacing ------------------------------------------------- */\n  --gutter-page:      var(--space-6);   /* px-6 horizontal page padding   */\n  --pad-card:         var(--space-5);   /* directory card                 */\n  --pad-card-detail:  var(--space-6);   /* detail-page left card          */\n  --pad-card-sidebar: var(--space-4);   /* detail-page sidebar cards      */\n  --gap-grid:         var(--space-5);   /* grid gap between cards          */\n  --gap-stack:        var(--space-3);   /* default vertical stack         */\n\n  /* ---- Layout widths ---------------------------------------------------- */\n  --width-content:   80rem;   /* max-w-7xl — directory grid         */\n  --width-detail:    72rem;   /* max-w-6xl — detail page            */\n  --width-prose:     42rem;   /* max-w-2xl — landing hero copy      */\n  --height-nav:      3.5rem;  /* h-14 sticky navbar                 */\n\n  /* ---- Icon / control sizing -------------------------------------------- */\n  --size-icon-sm:  0.875rem; /* 14px brand glyphs                  */\n  --size-icon:     1rem;     /* 16px lucide default                */\n  --size-logo-sm:  2rem;     /* 32px card favicon                  */\n  --size-logo-lg:  4rem;     /* 64px detail hero logo              */\n  --control-h:     2.25rem;  /* 36px — filter buttons (h-9)        */\n  --control-h-lg:  2.75rem;  /* 44px — primary buttons (h-11)      */\n}\n\n/* ============================================================================\n   RADIUS, SHADOWS & MOTION — Compendium Design System\n   The product is restrained: hairline borders do most of the work, shadows are\n   used sparingly (popovers/dropdowns only), and cards rely on border + a small\n   hover lift rather than heavy elevation. Corner radii follow shadcn's --radius\n   convention (base 0.5rem) plus a larger rounded-xl for cards.\n   ========================================================================== */\n\n:root {\n  /* ---- Corner radii ----------------------------------------------------- */\n  --radius:     0.5rem;                 /* 8px  — shadcn base (--radius)    */\n  --radius-sm:  calc(var(--radius) - 4px); /* 4px — small chips / inputs    */\n  --radius-md:  calc(var(--radius) - 2px); /* 6px — buttons                 */\n  --radius-lg:  var(--radius);          /* 8px  — landing info cards        */\n  --radius-xl:  0.75rem;                /* 12px — directory + detail cards  */\n  --radius-full:9999px;                 /* pills: category, tag, price      */\n\n  /* ---- Elevation -------------------------------------------------------- */\n  /* Cards: NO drop shadow — defined by a 1px border. Overlays get shadows. */\n  --shadow-none:  none;\n  --shadow-sm:    0 1px 2px 0 rgb(15 23 42 / 0.05);\n  --shadow-popover: 0 4px 12px -2px rgb(15 23 42 / 0.10),\n                    0 2px 6px -2px  rgb(15 23 42 / 0.08);  /* dropdowns/popovers */\n\n  /* ---- Focus ring ------------------------------------------------------- */\n  --ring-width:  2px;\n  --ring-offset: 2px;\n\n  /* ---- Motion ----------------------------------------------------------- */\n  /* Quiet, utilitarian. Color/transform transitions only; no bounces. */\n  --duration-fast:  150ms; /* @kind other */\n  --duration-base:  200ms; /* @kind other */\n  --ease-standard:  cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */  /* Tailwind default ease */\n  --transition-colors: color var(--duration-base) var(--ease-standard),\n                       background-color var(--duration-base) var(--ease-standard),\n                       border-color var(--duration-base) var(--ease-standard);\n  --transition-all:    all var(--duration-base) var(--ease-standard);\n\n  /* Signature card-hover lift */\n  --hover-lift: translateY(-2px); /* @kind other */\n}\n\n\n/* ---- Minimal base reset -------------------------------------------------- */\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  background-color: var(--background);\n  color: var(--primary-text);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n<\u002Fstyle>\n  <script src=\"efe627fe-703f-42f0-80c5-22342aa51c7a\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; padding: 0; }\n    a { text-decoration: none; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" class=\"dark\" style=\"min-height: 100vh; background: var(--background); font-family: var(--font-sans); color: var(--primary-text); -webkit-font-smoothing: antialiased;\">\n\n  <nav style=\"position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; height: var(--height-nav); padding: 0 var(--gutter-page); background: var(--card-bg); border-bottom: 1px solid var(--nav-border);\">\n    <div style=\"display: flex; align-items: center; gap: 0.375rem; font-size: var(--text-sm);\">\n      <a href=\"#\" style=\"color: var(--muted-text);\">Home<\u002Fa>\n      <span style=\"color: var(--muted-text);\">/<\u002Fspan>\n      <span style=\"font-weight: var(--weight-medium); color: var(--primary-text);\">Topics<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 0.5rem;\">\n      <a href=\"#\" style=\"display: inline-flex; align-items: center; height: 2.25rem; padding: 0 0.75rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--muted-text);\">Toooooooooools<\u002Fa>\n      <a href=\"#\" style=\"display: inline-flex; align-items: center; height: 2.25rem; padding: 0 0.75rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--accent);\">Topics<\u002Fa>\n      <a href=\"#\" style=\"display: inline-flex; align-items: center; height: 2.25rem; padding: 0 0.75rem; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--muted-text);\">Twitter<\u002Fa>\n      <button type=\"button\" onclick=\"{{ toggleTheme }}\" aria-label=\"Toggle theme\" style=\"display: inline-flex; align-items: center; justify-content: center; height: 2.25rem; width: 2.25rem; border-radius: var(--radius-md); background: transparent; border: 1px solid transparent; cursor: pointer; color: var(--muted-text); transition: var(--transition-colors);\" style-hover=\"color: var(--primary-text); background: var(--table-header-bg);\">\n        <span style=\"font-size: 1rem; line-height: 1;\">{{ themeGlyph }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"max-width: 80rem; margin: 0 auto; padding: 3rem var(--gutter-page) 5rem;\">\n\n    <header style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; flex-wrap: wrap; margin-bottom: 2.5rem;\">\n      <div style=\"max-width: 42rem;\">\n        <h1 style=\"margin: 0 0 0.75rem; font-size: var(--text-4xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); color: var(--primary-text);\">Topics<\u002Fh1>\n        <p style=\"margin: 0; font-size: var(--text-lg); line-height: var(--leading-relaxed); color: var(--muted-text);\">Everything in the compendium, grouped. {{ totalTools }} tools across {{ totalCats }} categories in {{ totalTopics }} topics — pick a lane and dig in.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: inline-flex; padding: 0.25rem; gap: 0.25rem; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card-bg);\">\n        <button type=\"button\" onclick=\"{{ showCards }}\" style=\"{{ cardsBtnStyle }}\">Cards<\u002Fbutton>\n        <button type=\"button\" onclick=\"{{ showIndex }}\" style=\"{{ indexBtnStyle }}\">Index<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <sc-if value=\"{{ isCards }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--gap-grid);\">\n        <sc-for list=\"{{ topics }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <section style=\"display: flex; flex-direction: column; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--pad-card-detail);\">\n            <div style=\"display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.375rem;\">\n              <span style=\"display: inline-flex; align-items: center; justify-content: center; height: 2.5rem; width: 2.5rem; border-radius: var(--radius-md); background: var(--background); border: 1px solid var(--border); font-size: 1.25rem; line-height: 1;\">{{ t.icon }}<\u002Fspan>\n              <h2 style=\"margin: 0; flex: 1; font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); color: var(--primary-text);\">{{ t.name }}<\u002Fh2>\n            <\u002Fdiv>\n            <p style=\"margin: 0 0 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); font-size: var(--text-xs); font-weight: var(--weight-medium); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--muted-text);\">{{ t.total }} tools · {{ t.catCount }} categories<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 0.125rem;\">\n              <sc-for list=\"{{ t.categories }}\" as=\"c\" hint-placeholder-count=\"6\">\n                <a href=\"{{ c.href }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.5rem 0.625rem; border-radius: var(--radius-md); color: var(--primary-text); font-size: var(--text-sm); transition: background-color 200ms cubic-bezier(0.4,0,0.2,1);\" style-hover=\"background: var(--row-hover-bg); color: var(--accent);\">\n                  <span style=\"overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ c.name }}<\u002Fspan>\n                  <span style=\"flex-shrink: 0; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted-text);\">{{ c.count }}<\u002Fspan>\n                <\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isIndex }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"column-width: 22rem; column-gap: var(--gap-grid);\">\n        <sc-for list=\"{{ topics }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <section style=\"break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 2.25rem;\">\n            <div style=\"display: flex; align-items: baseline; gap: 0.5rem; padding-bottom: 0.625rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border);\">\n              <span style=\"font-size: 1rem; line-height: 1;\">{{ t.icon }}<\u002Fspan>\n              <h2 style=\"margin: 0; flex: 1; font-size: var(--text-lg); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); color: var(--primary-text);\">{{ t.name }}<\u002Fh2>\n              <span style=\"font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted-text);\">{{ t.total }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ t.categories }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <a href=\"{{ c.href }}\" style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 0.3125rem 0.5rem; border-radius: var(--radius-md); color: var(--primary-text); font-size: var(--text-sm); transition: background-color 200ms cubic-bezier(0.4,0,0.2,1);\" style-hover=\"background: var(--row-hover-bg); color: var(--accent);\">\n                <span style=\"overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ c.name }}<\u002Fspan>\n                <span style=\"flex-shrink: 0; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted-text);\">{{ c.count }}<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { theme: 'dark', layout: 'cards' };\n  rootRef = React.createRef();\n\n  // Raw breakdown from categories count.csv. Zero-count categories and the\n  // null Misc row are dropped; topics sorted by total tool count desc.\n  RAW = {\n    AI:           [['AI Agents',52],['AI Coding',41],['AI Design',40],['AI Directories',32],['AI Productivity',32],['AI Automation',30],['Prompt Engineering',26],['AI Search',12]],\n    Crypto:       [['Analytics',45],['Research',28],['Data',26],['DeFi',14],['Infrastructure',14],['Dev Tooling',12],['Wallets',11],['Prediction Markets',10],['Payments',8],['Security',7]],\n    Design:       [['Design Resources',35],['Interface Design',28],['UI Frameworks',19],['Figma Tools',16],['Design Inspiration',11],['Icon Sets',10],['Wireframing',9],['Colors',7],['Design Mockups',2]],\n    Directories:  [['Tool Directory',22],['Resource Directory',21],['API Directory',8],['GitHub Directory',5],['Product Directory',0]],\n    Engineering:  [['Developer Tools',46],['Website Builders',45],['APIs',39],['Scrapers',27],['MCP Tools',20],['Open Source Repos',20],['Automation',6],['Code Editors',6],['Infrastructure',5]],\n    Investing:    [['Market Research',65],['Data Tools',34],['Newsletters',29],['Screeners',17],['Market News',10],['Funds',9],['Communities',8]],\n    Learning:     [['Online Courses',29],['Tutorials',24],['Learning Platforms',15],['Reference',10],['Books',6]],\n    Media:        [['Podcast',11],['Substacks',10],['Blog',7],['Research Publication',6],['YouTube Channel',4]],\n    Misc:         [['null',0]],\n    OSINT:        [['Email Lookup',22],['People Lookup',20],['Phone Lookup',15],['Company Lookup',14],['Sockpuppets',13],['Scrapers',12],['Telegram OSINT',11],['Data Breaches',10],['Image Analysis',9],['Username Lookup',9],['Vehicles',8],['Website Intelligence',8],['Discord OSINT',7],['Social Accounts',5]],\n    Productivity: [['Utilities',25],['File Tools',22],['Workflow Automation',17],['Browser Extensions',16],['Research Tools',12],['Notetakers',9],['Personal Tools',5]],\n    Social:       [['Discord Servers',12],['Communities',8],['Social Discovery',8],['Telegram Channels',8],['Creators',5]],\n  };\n\n  ICONS = {\n    AI: '🤖', Engineering: '⚙️', Crypto: '₿', Investing: '📈', OSINT: '🔍',\n    Design: '🎨', Productivity: '⚡', Learning: '📚', Directories: '🗂️',\n    Social: '💬', Media: '🎬', Misc: '🗂️',\n  };\n\n  slug(s) {\n    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');\n  }\n\n  buildTopics() {\n    return Object.entries(this.RAW)\n      .map(([name, cats]) => {\n        const categories = cats\n          .filter(([cn, cc]) => cn !== 'null' && cc > 0)\n          .map(([cn, cc]) => ({\n            name: cn,\n            count: cc,\n            href: `/tools?topic=${encodeURIComponent(name)}&category=${encodeURIComponent(cn)}`,\n          }));\n        const total = categories.reduce((a, c) => a + c.count, 0);\n        return { name, icon: this.ICONS[name] || '🗂️', categories, catCount: categories.length, total };\n      })\n      .filter((t) => t.catCount > 0)\n      .sort((a, b) => b.total - a.total);\n  }\n\n  componentDidMount() { this.applyTheme(); }\n  componentDidUpdate() { this.applyTheme(); }\n  applyTheme() {\n    const el = this.rootRef.current;\n    if (el) el.classList.toggle('dark', this.state.theme === 'dark');\n  }\n\n  renderVals() {\n    const topics = this.buildTopics();\n    const totalTools = topics.reduce((a, t) => a + t.total, 0);\n    const totalCats = topics.reduce((a, t) => a + t.catCount, 0);\n    const isCards = this.state.layout === 'cards';\n\n    const segBase = 'padding: 0.375rem 0.875rem; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; transition: var(--transition-colors);';\n    const segActive = segBase + ' background: var(--blue-600); color: var(--white);';\n    const segIdle = segBase + ' background: transparent; color: var(--muted-text);';\n\n    return {\n      rootRef: this.rootRef,\n      topics,\n      totalTools,\n      totalCats,\n      totalTopics: topics.length,\n      isCards,\n      isIndex: !isCards,\n      themeGlyph: this.state.theme === 'dark' ? '☀' : '☾',\n      toggleTheme: () => this.setState((s) => ({ theme: s.theme === 'dark' ? 'light' : 'dark' })),\n      showCards: () => this.setState({ layout: 'cards' }),\n      showIndex: () => this.setState({ layout: 'index' }),\n      cardsBtnStyle: isCards ? segActive : segIdle,\n      indexBtnStyle: isCards ? segIdle : segActive,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
